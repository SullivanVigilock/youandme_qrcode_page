<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notre Duo Musical</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #111, #222);
        color: white;
        text-align: center;
        padding: 30px 20px;
    }

    .container {
        max-width: 500px;
        margin: auto;
        background: rgba(255,255,255,0.08);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h1 {
        margin-bottom: 10px;
        font-size: 2em;
    }

    p {
        color: #ccc;
        margin-bottom: 30px;
    }

    .link {
        display: block;
        text-decoration: none;
        color: white;
        padding: 15px;
        margin: 12px 0;
        border-radius: 12px;
        font-size: 1.1em;
        font-weight: bold;
        transition: 0.3s;
    }

    .facebook { background: #1877f2; }
    .instagram { background: #e1306c; }
    .youtube { background: #ff0000; }

    .link:hover {
        transform: scale(1.03);
        opacity: 0.9;
    }

    .footer {
        margin-top: 25px;
        font-size: 0.9em;
        color: #aaa;
    }
</style>
</head>
<body>

<div class="container">
    <h1>🎵 Nom du Duo</h1>
    <p>Suivez-nous sur les réseaux !</p>

    <a class="link facebook" href="https://facebook.com/tonprofil" target="_blank">
        Facebook
    </a>

    <a class="link instagram" href="https://instagram.com/tonprofil" target="_blank">
        Instagram
    </a>

    <a class="link youtube" href="https://youtube.com/@tonprofil" target="_blank">
        YouTube
    </a>

    <div class="footer">
        Merci pour votre soutien ❤️
    </div>
</div>

</body>
</html>
