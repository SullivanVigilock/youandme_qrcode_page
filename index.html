<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notre Duo Musical</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #111, #222);
        color: white;
        text-align: center;
        padding: 30px 20px;
    }

    .container {
        max-width: 500px;
        margin: auto;
        background: rgba(255,255,255,0.08);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .logo{
        width:140px;
        max-width:80%;
        margin-bottom:20px;
    }

    .logo-circle{
        width:160px;
        height:160px;
        border-radius:50%;
        object-fit:cover;
        border:4px solid white;
        box-shadow:0 8px 25px rgba(0,0,0,0.35);
        margin-bottom:20px;
    }

    h1 {
        margin-bottom: 10px;
        font-size: 2em;
    }

    p {
        color: #ccc;
        margin-bottom: 30px;
    }

    .link {
        display: block;
        text-decoration: none;
        color: white;
        padding: 15px;
        margin: 12px 0;
        border-radius: 12px;
        font-size: 1.1em;
        font-weight: bold;
        transition: 0.3s;
    }

    .facebook { background: #1877f2; }
    .instagram { background: #e1306c; }
    .youtube { background: #ff0000; }

    .link:hover {
        transform: scale(1.03);
        opacity: 0.9;
    }

    .footer {
        margin-top: 25px;
        font-size: 0.9em;
        color: #aaa;
    }
</style>
</head>
<body>

<div class="container">
    <img src="logo.png" alt="Logo Duo" class="logo-circle">
    <h1>🎵 You&Me 🎵<br />Duo acoustique</h1>
    <p>Suivez-nous sur les réseaux !</p>

    <a class="link facebook" href="https://facebook.com/youandmetroyes">
        <i class="fa-brands fa-facebook-f"></i> Facebook
    </a>

    <a class="link instagram" href="https://instagram.com/youandmetroyes">
        <i class="fa-brands fa-instagram"></i> Instagram
    </a>

    <a class="link youtube" href="https://youtube.com/@youandmetroyes">
        <i class="fa-brands fa-youtube"></i> YouTube
    </a>
    <!-- <a class="link facebook" href="https://facebook.com/tonprofil" target="_blank">
        Facebook
    </a>

    <a class="link instagram" href="https://instagram.com/tonprofil" target="_blank">
        Instagram
    </a>

    <a class="link youtube" href="https://youtube.com/@tonprofil" target="_blank">
        YouTube
    </a> -->

    <div class="footer">
        Merci pour votre soutien ❤️
    </div>
</div>

</body>
</html>
